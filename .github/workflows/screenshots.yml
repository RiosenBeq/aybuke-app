name: Screenshots

# Captures every key screen on an iOS Simulator using the app's DEBUG
# screenshot scenes (-GLScreenshotScene <scene>, see ios/App/App/ScreenshotScenes.swift),
# then publishes them as an artifact and to the single-commit `screenshots` branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/screenshots.yml"

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  simulator:
    name: Simulator screenshots
    # Xcode 26 (iOS 26 SDK): the app uses the iOS 26 speech and on-device AI APIs.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = []
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in items:
                  name = device["name"]
                  if name.startswith("iPhone") and "Pro" in name and "Max" not in name:
                      found.append((runtime, name, device["udid"]))
          found.sort()
          print(found[-1][2] if found else "")
          ')
          if [ -z "$UDID" ]; then xcrun simctl list devices available; echo "No iPhone Pro simulator found"; exit 1; fi
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ios/Glowlit.xcodeproj \
            -scheme Glowlit \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -quiet

      - name: Boot, install and capture
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/Glowlit.app
          mkdir -p screenshots
          for scene in onboarding home create results edit editor result share library paywall consent settings legal; do
            xcrun simctl terminate "$UDID" app.glowlit.ios >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" app.glowlit.ios -GLScreenshotScene "$scene"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$scene.png"
          done
          ls -la screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Publish to the screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          printf '# Glowlit simulator screenshots\n\nGenerated by `.github/workflows/screenshots.yml` from commit %s.\n' "$GITHUB_SHA" > README.md
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
