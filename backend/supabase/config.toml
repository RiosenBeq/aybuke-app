# Supabase CLI configuration (partial; the CLI fills in defaults).
# See backend/README.md for the full setup.
project_id = "glowlit"

[auth]
# Every user starts as an anonymous user (no sign-up wall, Guideline 5.1.1(v)).
enable_anonymous_sign_ins = true

# Optional Sign in with Apple (native ID token from the app), so Pro and credits
# follow the user to other iPhones. The client id is the app's bundle id. On the
# hosted project: Authentication → Providers → Apple → add app.glowlit.ios.
[auth.external.apple]
enabled = true
client_id = "app.glowlit.ios"
secret = ""

[functions.ai-image]
verify_jwt = true

[functions.credits-redeem]
verify_jwt = true

[functions.account]
verify_jwt = true

[functions.report]
verify_jwt = true

# Writing help from Claude (text only): the function also requires a user session.
[functions.assist]
verify_jwt = true

# Rewarded ads. AdMob's server-side verification callback carries no JWT, so
# the gateway can't check one: the function verifies Google's ECDSA signature
# on the callback, and checks the user's session itself on the app's routes.
# Deploy with: supabase functions deploy ad-reward --no-verify-jwt
[functions.ad-reward]
verify_jwt = false

# App Store Server Notifications V2 (refunds and revocations). Apple's servers
# send no JWT: the function verifies Apple's signature on the payload instead.
# Deploy with: supabase functions deploy app-store-notifications --no-verify-jwt
[functions.app-store-notifications]
verify_jwt = false

# "Which vibe?" polls. JWT verification stays on: the app sends her session,
# the poll page on aybuke.org the public anon key (as Bearer and apikey), so
# the gateway refuses anything without the project's key; the function checks
# her session itself on the routes that need it, and signs its picture URLs.
# Deploy with: supabase functions deploy polls
[functions.polls]
verify_jwt = true

# The owner's daily digest mail. JWT verification stays on (the GitHub workflow
# sends the anon key); the x-digest-secret header must equal DIGEST_SECRET.
# Deploy with: supabase functions deploy owner-digest
[functions.owner-digest]
verify_jwt = true

# The owner's admin API for the admin page on aybuke.org. JWT verification
# stays on (the page sends the public anon key); x-admin-token, compared by
# its SHA-256 with ADMIN_TOKEN_SHA256, is the real check.
# Deploy with: supabase functions deploy admin
[functions.admin]
verify_jwt = true
